<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My projects — skill_issue</title>
        <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
        <link rel="stylesheet" href="/static/css/fonts.css" />
        <script type="module" src="/static/js/shared/accent.js"></script>
        <link rel="stylesheet" href="/static/css/variables.css" />
        <link rel="stylesheet" href="/static/css/base.css" />
        <link rel="stylesheet" href="/static/css/ui.css" />
        <link rel="stylesheet" href="/static/css/profile.css" />
        <script type="module" src="/static/js/pages/my-projects.js"></script>
    </head>
    <body>
        <a class="skip-link" href="#content">Skip to content</a>
        <header class="site-header">
            <div class="site-header-inner">
                <a class="site-brand" href="/" aria-label="skill.issue — Home">
                    <svg
                        class="brand-mark brand-chevron"
                        width="24"
                        height="36"
                        viewBox="0 0 24 36"
                        fill="currentColor"
                        aria-hidden="true"
                        focusable="false"
                    >
                        <path d="M0 0h9l15 18L9 36H0l15-18Z" />
                    </svg>
                    <span class="brand-name"
                        >skill<span class="brand-mark">.</span
                        ><wbr />issue</span
                    >
                </a>
                <nav class="site-nav team-nav" aria-label="Projects">
                    <a href="/#create-project">Create a project</a>
                    <span class="nav-slash" aria-hidden="true">/</span>
                    <a href="/#team-search">Find a project</a>
                </nav>
                <nav class="site-nav account-nav" aria-label="Account">
                    <a class="account-name" href="/profile">Profile</a>
                </nav>
            </div>
        </header>
        <main id="content" class="page-main profile-main" tabindex="-1">
            <div class="section-heading">
                <h1>My projects <span data-team-count></span></h1>
                <a href="/profile">Back to profile</a>
            </div>
            <noscript><p>Enable JavaScript to view your projects.</p></noscript>
            <p data-loading>Loading projects…</p>
            <p data-project-status role="status"></p>
            <p
                data-project-error
                class="alert alert-danger"
                role="alert"
                hidden
            ></p>
            <button data-retry class="btn btn-link" type="button" hidden>
                Try again
            </button>
            <div data-profile-teams></div>
        </main>
    </body>
</html>
